name: Benchmark
# Runs the benchmark suite benchmark/benchmarks.jl with AirspeedVelocity.jl for the
# default branch and the head of a pull request, and posts the comparison of run time
# and memory as a comment on the pull request.
on:
  pull_request_target:
    branches:
      - main
permissions:
  pull-requests: write # to post the comment
concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Benchmark (Julia ${{ matrix.julia-version }})
    # Only pull requests from branches of this repository (the job runs their code).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1'
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: ${{ matrix.julia-version }}
          # Benchmark script of the pull request, used for both revisions; benchmarks of
          # functions missing in the default branch are skipped there.
          bench-on: ${{ github.event.pull_request.head.sha }}
          exeflags: '--threads=2'

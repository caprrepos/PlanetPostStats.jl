name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JULIA_PKG_USE_CLI_GIT: "true"
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Access to the private dependency PlanetTools.jl
        # Pkg clones PlanetTools (see [sources] in Project.toml) with the git command line
        # (JULIA_PKG_USE_CLI_GIT), which uses this token for github.com/caprrepos.
        run: >-
          git config --global
          url."https://x-access-token:${{ secrets.PLANETTOOLS_TOKEN }}@github.com/caprrepos/".insteadOf
          "https://github.com/caprrepos/"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      JULIA_PKG_USE_CLI_GIT: "true"
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Access to the private dependency PlanetTools.jl
        # Pkg clones PlanetTools (see [sources] in Project.toml) with the git command line
        # (JULIA_PKG_USE_CLI_GIT), which uses this token for github.com/caprrepos.
        run: >-
          git config --global
          url."https://x-access-token:${{ secrets.PLANETTOOLS_TOKEN }}@github.com/caprrepos/".insteadOf
          "https://github.com/caprrepos/"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using PlanetPostStats
          DocMeta.setdocmeta!(PlanetPostStats, :DocTestSetup, :(using PlanetPostStats); recursive=true)
          doctest(PlanetPostStats)
